<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>“仅退款”数据新闻 · 图表索引</title>
<style>
  body { margin:0; background:#FFFBF2; color:#272727;
         font-family:"PingFang SC","Microsoft YaHei",sans-serif; line-height:1.7; }
  .wrap { max-width:760px; margin:0 auto; padding:48px 24px 80px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .sub { color:#8A8A8A; font-size:14px; margin:0 0 28px; }
  ul { list-style:none; padding:0; margin:0; }
  li { border-bottom:1px solid #EDE6DA; }
  a { padding:16px 8px; color:#272727; text-decoration:none;
      display:flex; justify-content:space-between; align-items:center; transition:.2s; }
  a:hover { background:#F6ECEF; color:#BC0039; padding-left:14px; }
  a .no { color:#BC0039; font-weight:700; margin-right:14px; }
  a .arrow { color:#C9A9B3; }
  .loading { color:#8A8A8A; padding:16px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>「仅退款」数据新闻 · 图表索引</h1>
  <p class="sub">点击任一图表查看交互版本（可嵌入 iframe）· 自动列出仓库全部图表</p>
  <ul id="list"><li class="loading">加载中…</li></ul>
</div>
<script>
(function(){
  var OWNER = 'silencexn', REPO = 'jintuikuan-charts';
  var listEl = document.getElementById('list');
  fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/')
    .then(function(r){ return r.json(); })
    .then(function(files){
      var htmls = files.filter(function(f){
        return f.type === 'file' && /\.html$/i.test(f.name) && f.name.toLowerCase() !== 'index.html';
      });
      if (!htmls.length){ listEl.innerHTML = '<li class="loading">仓库里暂时没有图表文件</li>'; return; }
      // 先按文件名排序，保证顺序稳定
      htmls.sort(function(a,b){ return a.name.localeCompare(b.name); });
      listEl.innerHTML = '';
      htmls.forEach(function(f, i){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = f.name;
        a.innerHTML = '<span><span class="no">' + String(i+1).padStart(2,'0') +
                      '</span><span class="t">' + f.name + '</span></span><span class="arrow">→</span>';
        li.appendChild(a); listEl.appendChild(li);
        // 读取每个文件的 <title> 作为显示名
        fetch(f.name).then(function(r){ return r.text(); }).then(function(html){
          var m = html.match(/<title>([^<]*)<\/title>/i);
          if (m && m[1]) a.querySelector('.t').textContent = m[1].trim();
        }).catch(function(){});
      });
    })
    .catch(function(){
      listEl.innerHTML = '<li class="loading">目录加载失败（可能是 GitHub API 访问受限），请直接用文件名访问各图。</li>';
    });
})();
</script>
</body>
</html>
